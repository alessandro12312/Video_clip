  /api/contests/end/:
    post:
      operationId: api_contests_end_create
      description: Endpoint per chiudere il contest attivo associato a un tag e decretare
        il vincitore (con spareggio ponderato).
      parameters:
      - in: query
        name: tag
        schema:
          type: string
          enum:
          - clutch
          - fail
          - funny
        description: Tag del contest da chiudere
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
