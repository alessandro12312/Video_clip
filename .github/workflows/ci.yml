name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: videoclip
          POSTGRES_PASSWORD: videoclip_test
          POSTGRES_DB: videoclip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: videoclip_test
      POSTGRES_USER: videoclip
      POSTGRES_PASSWORD: videoclip_test
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_STORAGE_MEDIA_BUCKET_NAME: test-media
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint check
        run: |
          cd backend
          ruff check .

      - name: Ruff format check
        run: |
          cd backend
          ruff format --check .

      - name: Run Django migrations
        run: |
          cd backend
          python manage.py migrate --run-syncdb

      - name: Run Django tests
        run: |
          cd backend
          python manage.py test --verbosity=2

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: ESLint check
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest
        run: |
          cd frontend
          npx vitest run

      - name: Build Next.js
        run: |
          cd frontend
          npm run build
